[project]
name = "switch-auto-play"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
authors = [
    { name = "thr3a", email = "thr3a@example.com" }
]
dependencies = [
    "nuxbt>=3.3.7",
    "openai>=3.16.2",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
    "ruff>=0.16.8",
]

[project.scripts]
switch-auto-play = "switch_auto_play:main"

[tool.uv]
python-preference = "only-system"
override-dependencies = ["dbus-python>=1.3.2"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
